[workspace]
resolver = "3"
members = [
    "crates/yaz-core",
    "crates/yaz-latex",
    "crates/yaz-compile",
    "crates/yaz-plugin",
    "crates/yaz-zotero",
    "crates/yaz-obsidian",
    "crates/yaz-vcs",
    "crates/yaz-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/GeneralPawz/yaz"
homepage = "https://generalpawz.github.io/yaz"
authors = ["yaz contributors"]

[workspace.dependencies]
# Internal. Path-only, deliberately: these crates are not published to crates.io,
# so carrying a `version` here would only create a second place for release-please
# to keep in sync. The single source of truth is [workspace.package] above.
yaz-core = { path = "crates/yaz-core" }
yaz-latex = { path = "crates/yaz-latex" }
yaz-compile = { path = "crates/yaz-compile" }
yaz-plugin = { path = "crates/yaz-plugin" }
yaz-zotero = { path = "crates/yaz-zotero" }
yaz-obsidian = { path = "crates/yaz-obsidian" }
yaz-vcs = { path = "crates/yaz-vcs" }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process", "sync", "time", "macros"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Filesystem
camino = { version = "1", features = ["serde1"] }
notify = "8"
notify-debouncer-full = "0.7"
walkdir = "2"
# Reading the SyncTeX database, which engines write gzipped. `rust_backend`
# rather than the zlib C library: ADR-0014 makes a dependency without a native
# aarch64 path a blocker, and miniz_oxide is pure Rust with nothing to link.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Misc
semver = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }
# `bundled` compiles SQLite from source rather than linking a system library.
# That is what makes it satisfy ADR-0014 without ceremony: it builds natively on
# aarch64 with no system package, and adds no runtime dependency to the
# installer.
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.11"
# Both root sources are compiled in, but only one is used at a time — see
# yaz_core::net and ADR-0019. Enabling both features alone would make reqwest
# trust the *union* of the OS store and Mozilla's list, which silently defeats
# the ability to honour an administrator distrusting a CA.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
rustls-native-certs = "0.8"

# Dev
pretty_assertions = "1"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }

# Release profile: optimise for a desktop app that must not be RAM hungry
# (see docs/adr/0015-performance-budgets.md)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep debug builds fast to iterate on, but not painfully slow at runtime.
[profile.dev]
opt-level = 0
debug = 1

# Dependencies are rarely re-compiled; optimise them even in dev so the
# editor stays responsive when running a debug build.
[profile.dev.package."*"]
opt-level = 2
