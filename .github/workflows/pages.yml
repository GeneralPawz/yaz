# Publishes the docs site to GitHub Pages on every push to main, so the site is
# never stale relative to the code. See docs/adr/0016-documentation-strategy.md.
name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The VitePress site lands in phase 2; until then there is nothing to publish.
  # hashFiles cannot be used in a job-level `if` (it needs a checked-out
  # workspace, and using it there makes the workflow fail to compile), so the
  # check runs as its own job.
  detect:
    runs-on: ubuntu-24.04
    outputs:
      site: ${{ steps.check.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f docs/.vitepress/config.ts ] && [ -f scripts/generate-docs.mjs ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "Docs site not present yet (phase 1) — nothing to publish."
          fi

  build:
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.site == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      # Everything enumerable is generated from the code: the command reference,
      # the settings reference, the keymap, the capability vocabulary, and the
      # plugin API. There is no second copy of these facts to drift.
      - name: Generate reference from code
        run: pnpm docs:generate

      # yaz-app is excluded on purpose. It depends on Tauri, so documenting it
      # would drag the whole GTK/WebKit stack into a docs job (the failure is
      # "system library glib-2.0 not found") — and it is a binary-only crate of
      # deliberately thin wiring, so its rustdoc is close to empty anyway.
      # The domain crates are where the documented API actually lives.
      - name: Build rustdoc
        # Broken intra-doc links fail the build. A reference page whose links
        # dead-end is worse than no page, and rustdoc only warns by default.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --exclude yaz-app

      # Site first, rustdoc second. VitePress empties its output directory on
      # build, so staging rustdoc into dist/ beforehand silently deleted it.
      - name: Build site
        run: pnpm docs:build

      - name: Stage rustdoc under /rust/
        run: |
          mkdir -p docs/.vitepress/dist/rust
          cp -r target/doc/. docs/.vitepress/dist/rust/
          test -f docs/.vitepress/dist/rust/yaz_core/index.html \
            || (echo "::error::rustdoc output missing after staging" && exit 1)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: [detect, build]
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
