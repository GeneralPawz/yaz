version: 2
updates:
  # Everything is grouped into a single PR per ecosystem. Ungrouped, the first
  # run opened nine PRs at once, each firing the full four-way build matrix —
  # far more review and CI cost than a pre-alpha scaffold justifies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

# Reminder for reviewers: ADR-0014 makes a dependency without a native aarch64
# path a blocker, not a caveat. A dependency bump that drops or breaks ARM64
# support must not be merged.
