[package]
name = "yaz-core"
description = "Project, document, workspace and settings model for yaz."
# Literal, not `version.workspace = true`: release-please writes this field and
# cannot do so through workspace inheritance. It keeps every crate in sync, and
# ADR-0012 forbids hand-editing versions anyway.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
camino.workspace = true
tracing.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
walkdir.workspace = true
semver.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
insta.workspace = true
