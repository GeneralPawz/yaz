[package]
name = "yaz-app"
description = "The yaz desktop application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "yaz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yaz-core.workspace = true
yaz-latex.workspace = true
yaz-compile.workspace = true
yaz-plugin.workspace = true
yaz-zotero.workspace = true
yaz-obsidian.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

anyhow.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

# yaz-app stays THIN: it wires the domain crates to Tauri commands and holds no
# domain logic of its own (ADR-0017). Anything here that starts to look like a
# decision about LaTeX, projects, or plugins belongs in a domain crate.
