[package]
name = "yaz-app"
description = "The yaz desktop application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "yaz"
path = "src/main.rs"

[features]
default = []

# Forwards to yaz-compile's feature of the same name. yaz-app needs its own
# declaration because `cfg!(feature = ...)` only sees features of the crate it
# is compiled in — without this, the check silently reads false and the engine
# picker would report Tectonic as missing from a build that actually has it.
tectonic-engine = ["yaz-compile/tectonic-engine"]

# Typst. Pure Rust, so unlike tectonic-engine this needs no vcpkg and builds
# anywhere — but it compiles a different document language, not .tex.
typst-engine = ["yaz-compile/typst-engine"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yaz-core.workspace = true
yaz-latex.workspace = true
yaz-compile.workspace = true
yaz-plugin.workspace = true
yaz-zotero.workspace = true
yaz-obsidian.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

anyhow.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

# yaz-app stays THIN: it wires the domain crates to Tauri commands and holds no
# domain logic of its own (ADR-0017). Anything here that starts to look like a
# decision about LaTeX, projects, or plugins belongs in a domain crate.
