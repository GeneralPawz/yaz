[package]
name = "yaz-app"
description = "The yaz desktop application binary."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "yaz"
path = "src/main.rs"

[dependencies]
yaz-core.workspace = true
yaz-latex.workspace = true
yaz-compile.workspace = true
yaz-plugin.workspace = true
yaz-zotero.workspace = true
yaz-obsidian.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# NOTE(phase-2): tauri, tauri-build and the plugin crates are added here, along
# with build.rs and the icon set. Deliberately absent for now so the workspace
# builds without a full Tauri bundling setup.
#
# yaz-app stays THIN: it wires the domain crates to Tauri commands and holds no
# domain logic of its own (ADR-0017).
