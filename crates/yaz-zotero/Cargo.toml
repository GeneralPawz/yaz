[package]
name = "yaz-zotero"
description = "Zotero library access for yaz: Better BibTeX, local API, exported .bib, and sqlite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
yaz-core.workspace = true
yaz-latex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
camino.workspace = true
tracing.workspace = true
reqwest.workspace = true

# The offline source. `bundled` compiles SQLite from source with cc rather than
# linking a system library, which is what gives it a native aarch64 build with no
# system dependency at all (ADR-0014) — the same reason the Typst engine is
# preferable to a vcpkg tree. Opened read-only on a copy, never against the live
# zotero.sqlite; see the module docs in src/sqlite.rs.
rusqlite = { workspace = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
insta.workspace = true
# Integration tests build a real database with Zotero's table shapes, because
# unit tests over pure functions would pass against wrong SQL.
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
yaz-core = { workspace = true }
